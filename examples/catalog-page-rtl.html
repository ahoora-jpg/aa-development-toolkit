<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نمونه صفحه کاتالوگ — aa-development-toolkit</title>
<meta name="description" content="نمونه‌ی مرجع صفحه‌ی کاتالوگ راست‌به‌چپ با توکن‌های طراحی، تایپوگرافی فارسی، و ساختار معنایی." />
<style>
  :root {
    --color-background: #ffffff;
    --color-foreground: #0a0a0a;
    --color-primary: #171717;
    --color-primary-foreground: #fafafa;
    --color-border: #e5e5e5;
    --color-muted: #f5f5f5;
    --space-2: 8px; --space-4: 16px; --space-6: 24px;
    --radius-md: 10px; --radius-lg: 16px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Vazirmatn", -apple-system, "Segoe UI", sans-serif;
    background: var(--color-background);
    color: var(--color-foreground);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--color-border);
  }
  .page-header { padding: var(--space-6); }
  .page-header h1 { margin: 0 0 var(--space-2); font-size: 1.5rem; }
  .page-header p { margin: 0; opacity: 0.65; font-size: 0.95rem; }

  .layout {
    display: grid; grid-template-columns: 220px 1fr; gap: var(--space-6);
    padding: 0 var(--space-6) var(--space-6);
  }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

  .filters {
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    padding: var(--space-4); height: fit-content;
  }
  .filters h2 { font-size: 1rem; margin: 0 0 var(--space-2); }
  .filters label { display: block; font-size: 0.9rem; margin: var(--space-2) 0; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: var(--space-4);
  }
  .card {
    border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    overflow: hidden; box-shadow: var(--shadow-1);
    display: flex; flex-direction: column;
  }
  .card .thumb {
    aspect-ratio: 4/3; background: var(--color-muted);
    display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 0.85rem;
  }
  .card .body { padding: var(--space-4); flex: 1; display: flex; flex-direction: column; }
  .card h3 { margin: 0 0 var(--space-2); font-size: 1rem; }
  .card .price { margin-top: auto; font-weight: 700; }

  /* RTL: directional icon mirrors (skills/ui-ux/rtl-farsi) */
  .icon-back { display: inline-block; transform: scaleX(-1); }

  :focus-visible { outline: 2px solid #4f83ff; outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <span style="font-weight:700;">برند</span>
  <nav aria-label="ناوبری اصلی">
    <a href="#" style="margin-inline-start: var(--space-4); color: inherit; text-decoration: none;">صفحه اصلی</a>
    <a href="#" style="margin-inline-start: var(--space-4); color: inherit; text-decoration: none;">درباره ما</a>
  </nav>
</header>

<div class="page-header">
  <h1>فهرست محصولات</h1>
  <p>۱۲ محصول یافت شد</p>
</div>

<div class="layout">
  <aside class="filters" aria-label="فیلترها">
    <h2>فیلتر بر اساس</h2>
    <label><input type="checkbox" /> موجود در انبار</label>
    <label><input type="checkbox" /> دارای تخفیف</label>
    <h2 style="margin-top: var(--space-4);">محدوده قیمت</h2>
    <label><input type="radio" name="price" /> کمتر از ۱۰۰ هزار تومان</label>
    <label><input type="radio" name="price" /> ۱۰۰ تا ۵۰۰ هزار تومان</label>
  </aside>

  <section class="grid" aria-label="نتایج">
    <article class="card">
      <div class="thumb">تصویر محصول</div>
      <div class="body">
        <h3>نمونه محصول یک</h3>
        <span class="price">۲۴۹,۰۰۰ تومان</span>
      </div>
    </article>
    <article class="card">
      <div class="thumb">تصویر محصول</div>
      <div class="body">
        <h3>نمونه محصول دو</h3>
        <span class="price">۱۸۹,۰۰۰ تومان</span>
      </div>
    </article>
    <article class="card">
      <div class="thumb">تصویر محصول</div>
      <div class="body">
        <h3>نمونه محصول سه</h3>
        <span class="price">۳۴۹,۰۰۰ تومان</span>
      </div>
    </article>
  </section>
</div>

</body>
</html>
